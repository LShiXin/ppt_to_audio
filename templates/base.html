<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PPT转视频 AI工具{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-active { border-left: 3px solid #3b82f6; background: #eff6ff; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-draft { background: #9ca3af; }
        .status-parsed { background: #f59e0b; }
        .status-scripted { background: #3b82f6; }
        .status-completed { background: #10b981; }
        audio::-webkit-media-controls-panel { background: #f3f4f6; }
        .pulse { animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="text-lg font-bold text-gray-800">PPT转音频 AI</a>
            <div class="flex gap-4 text-sm">
                <a href="/" class="text-gray-600 hover:text-blue-600">项目列表</a>
                <a href="/voices" class="text-gray-600 hover:text-blue-600">声音管理</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
